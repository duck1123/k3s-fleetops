# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
#
# Tab-completion for `nur apps restart <name>` (and any other app-scoped nur
# subcommand added later). nur has no built-in shell-completion generator, so
# this is a carapace-spec (https://github.com/carapace-sh/carapace-spec) file:
# carapace loads any spec placed at ~/.config/carapace/specs/<name>.yaml and
# uses it instead of falling through to its generic (mostly useless) fallback
# for that command. Install by symlinking or copying this file there:
#
#   ln -s "$(pwd)/scripts/nur-carapace-spec.yaml" ~/.config/carapace/specs/nur.yaml
#
# Only `nur apps *` is modeled here, not the rest of the nur CLI surface —
# nothing else currently completes either, so this is a strict improvement
# with no regressions. `nur apps list` prints one app name per line (see
# scripts/nur.nu) specifically so it's usable as a completion source here.
name: nur
description: nu shell taskrunner (see nurfile in this repo)
commands:
  - name: apps
    description: App management
    commands:
      - name: list
        description: List every app name known to `nur apps restart`

      - name: restart
        description: Restart an app's pod(s)
        completion:
          positional:
            - ["$(nur -q apps list)"]
