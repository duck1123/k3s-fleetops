apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/instance: superset
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: superset
    app.kubernetes.io/part-of: superset
    app.kubernetes.io/version: 6.1.0
    helm.sh/chart: superset-0.22.7
  name: superset-config
  namespace: superset
stringData:
  superset_bootstrap.sh: |
    #!/bin/bash
    if [ ! -f ~/bootstrap ]; then
      /app/.venv/bin/python3 -m ensurepip
      /app/.venv/bin/python3 -m pip install --no-cache-dir psycopg2-binary
      echo "Running Superset with uid 0" > ~/bootstrap
    fi
  superset_config.py: |


    import os
    import json
    from urllib.parse import quote
    from flask_caching.backends.rediscache import RedisCache

    def env(key, default=None):
        return os.getenv(key, default)
    SQLALCHEMY_DATABASE_URI = f"postgresql+psycopg2://{quote(env('DB_USER', ''), safe='')}:{quote(env('DB_PASS', ''), safe='')}@{env('DB_HOST')}:{env('DB_PORT')}/{env('DB_NAME')}"
    SQLALCHEMY_TRACK_MODIFICATIONS = False
    _redis_user = quote(env('REDIS_USER', ''), safe='')
    _redis_password = quote(env('REDIS_PASSWORD', ''), safe='')
    _redis_auth = f"{_redis_user}:{_redis_password}@" if (_redis_user or _redis_password) else ""
    REDIS_BASE_URL = f"redis://{_redis_auth}{env('REDIS_HOST')}:{env('REDIS_PORT')}"
    REDIS_URL_PARAMS = ""
    CACHE_REDIS_URL = f"{REDIS_BASE_URL}/3{REDIS_URL_PARAMS}"
    CELERY_REDIS_URL = f"{REDIS_BASE_URL}/4{REDIS_URL_PARAMS}"
    CACHE_CONFIG = {
        'CACHE_TYPE': 'RedisCache',
        'CACHE_DEFAULT_TIMEOUT': 86400,
        'CACHE_KEY_PREFIX': "superset_",
        'CACHE_REDIS_URL': CACHE_REDIS_URL,
    }
    DATA_CACHE_CONFIG = CACHE_CONFIG
    from datetime import timedelta
    SQLLAB_ASYNC_TIME_LIMIT_SEC = int(timedelta(hours=6).total_seconds())
    from celery.schedules import crontab
    from datetime import timedelta

    class CeleryConfig:
        imports = (
            "superset.sql_lab",
            "superset.tasks.scheduler",
            "superset.tasks.thumbnails",
            "superset.tasks.cache",
            "superset.tasks.slack",
        )
        broker_connection_retry_on_startup = True
        worker_prefetch_multiplier = 10
        task_acks_late = True
        broker_url = CELERY_REDIS_URL
        result_backend = CELERY_REDIS_URL
        task_annotations = {
            "sql_lab.get_sql_results": {
                "rate_limit": "100/s",
            },
        }
        beat_schedule = {
            "reports.scheduler": {
                "task": "reports.scheduler",
                "schedule": crontab(minute="*", hour="*"),
                "options": {"expires": int(timedelta(weeks=1).total_seconds())},
            },
            "reports.prune_log": {
                "task": "reports.prune_log",
                "schedule": crontab(minute=0, hour=0),
            },
        }

    CELERY_IMPORTS = CeleryConfig.imports
    CELERY_CONFIG = CeleryConfig
    CELERY_WORKER_HEALTH_CHECK_ENABLED = False
    RESULTS_BACKEND = RedisCache(host=env("REDIS_HOST"), port=int(env("REDIS_PORT", "6379")), password=env("REDIS_PASSWORD", ""), db=int(env("REDIS_DB", "1")), key_prefix="superset_results")
    GLOBAL_ASYNC_QUERIES_CACHE_BACKEND = {
        "CACHE_TYPE": "RedisCache",
        "CACHE_REDIS_HOST": "superset-redis-headless",
        "CACHE_REDIS_PORT": 6379,
        "CACHE_REDIS_USER": "",
        "CACHE_REDIS_PASSWORD": "",
        "CACHE_REDIS_DB": 3,
        "CACHE_KEY_PREFIX": "qc-",
        "CACHE_DEFAULT_TIMEOUT": 86400,
        "CACHE_REDIS_SSL": False,
        "CACHE_REDIS_SSL_CERTFILE": None,
        "CACHE_REDIS_SSL_KEYFILE": None,
        "CACHE_REDIS_SSL_CERT_REQS": "required",
        "CACHE_REDIS_SSL_CA_CERTS": None,
    }
    GLOBAL_ASYNC_QUERIES_RESULTS_BACKEND = {
        "backend": "redis",
        "host": "superset-redis-headless",
        "port": 6379,
        "prefix": "qc-",
        "db": 3,
        "password": "",
    }
    FAB_ADD_SECURITY_API = True
    FAB_ADD_SECURITY_VIEWS = True
    GLOBAL_ASYNC_QUERIES_TRANSPORT = "polling"
    # Custom Overrides
    # secret_key
    SECRET_KEY = os.environ.get("SECRET_KEY")
  superset_init.sh: |
    #!/bin/sh
    set -eu
    echo "Upgrading DB schema..."
    superset db upgrade
    echo "Initializing roles and permissions..."
    superset init
    echo "Init job: Creating admin user and loading initial data..."
    echo "Skipping admin creation (init.createAdmin=false)"
    echo "Skipping examples (init.loadExamples=false)"
    if [ -f "/app/configs/import_datasources.yaml" ]; then
      echo "Importing database connections..."
      superset import_datasources -p /app/configs/import_datasources.yaml
    fi
    echo "Init job complete."
type: Opaque
