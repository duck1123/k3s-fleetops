apiVersion: apps/v1
kind: Deployment
metadata:
  name: ditto-relay
  namespace: ditto-relay
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ditto-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ditto-relay
    spec:
      containers:
        - command:
            - ditto-relay
          env:
            - name: PORT
              value: "13131"
            - name: RELAY_URL
              value: wss://relay.duck1123.com/
            - name: OPENSEARCH_NODE
              value: http://ditto-relay-opensearch.ditto-relay:9200
            - name: LOG_LEVEL
              value: info
            - name: IP_HEADER
              value: CF-Connecting-IP
            - name: NOSTR_NSEC
              valueFrom:
                secretKeyRef:
                  key: NOSTR_NSEC
                  name: ditto-relay-nsec
          image: ghcr.io/lillecarl/nix-csi/scratch:1.0.1
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 13131
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          name: ditto-relay
          ports:
            - containerPort: 13131
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 13131
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /nix
              name: nix
              subPath: nix
      volumes:
        - csi:
            driver: nix.csi.store
            volumeAttributes:
              nixExpr: |
                (builtins.getFlake "github:duck1123/k3s-fleetops").packages.x86_64-linux.ditto-relay-bundle
          name: nix
