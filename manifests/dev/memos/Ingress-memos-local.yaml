apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: memos-local
  namespace: memos
spec:
  ingressClassName: traefik
  rules:
    - host: memos.home.kronkltd.net
      http:
        paths:
          - backend:
              service:
                name: memos
                port:
                  name: http
            path: /
            pathType: ImplementationSpecific
  tls:
    - hosts:
        - memos.home.kronkltd.net
      secretName: memos-local-tls
