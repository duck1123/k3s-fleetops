apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-navidrome-music-nfs
spec:
  accessModes:
    - ReadOnlyMany
  capacity:
    storage: 1Ti
  mountOptions:
    - nolock
    - noexec
    - soft
    - timeo=30
  nfs:
    path: /volume1/Music
    readOnly: true
    server: 192.168.0.124
  persistentVolumeReclaimPolicy: Retain
