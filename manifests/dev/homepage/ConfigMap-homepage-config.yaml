apiVersion: v1
data:
  bookmarks.yaml: |
    []
  services.yaml: |
    - Storage:
        - attic:
            href: https://attic.home.kronkltd.net
            siteMonitor: https://attic.home.kronkltd.net
        - garage:
            href: https://garage.home.kronkltd.net
            siteMonitor: https://garage.home.kronkltd.net
        - longhorn:
            href: https://longhorn.home.kronkltd.net
            siteMonitor: https://longhorn.home.kronkltd.net
    - Database:
        - cloudbeaver:
            href: https://cloudbeaver.home.kronkltd.net
            siteMonitor: https://cloudbeaver.home.kronkltd.net
        - nocodb:
            href: https://nocodb.home.kronkltd.net
            siteMonitor: https://nocodb.home.kronkltd.net
    - Download:
        - qbittorrent:
            href: https://qbittorrent.home.kronkltd.net
            siteMonitor: https://qbittorrent.home.kronkltd.net
        - sabnzbd:
            href: https://sabnzbd.home.kronkltd.net
            siteMonitor: https://sabnzbd.home.kronkltd.net
            widget:
              key: '{{HOMEPAGE_VAR_SABNZBD_API_KEY}}'
              type: sabnzbd
              url: http://sabnzbd.sabnzbd:8080
        - slskd:
            href: https://slskd.home.kronkltd.net
            siteMonitor: https://slskd.home.kronkltd.net
    - Arr:
