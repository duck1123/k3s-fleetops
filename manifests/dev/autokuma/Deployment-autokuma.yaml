apiVersion: apps/v1
kind: Deployment
metadata:
  name: autokuma
  namespace: autokuma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: autokuma
      app.kubernetes.io/name: autokuma
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: autokuma
        app.kubernetes.io/name: autokuma
    spec:
      containers:
        - command:
            - autokuma
          env:
            - name: AUTOKUMA__KUMA__URL
              value: http://uptime-kuma.uptime-kuma:3001
            - name: AUTOKUMA__DOCKER__ENABLED
              value: "false"
            - name: AUTOKUMA__KUBERNETES__ENABLED
              value: "false"
            - name: AUTOKUMA__STATIC_MONITORS
              value: /data/monitors
            - name: AUTOKUMA__ON_DELETE
              value: delete
            - name: SSL_CERT_FILE
              value: /nix/var/result/etc/ssl/certs/ca-bundle.crt
            - name: AUTOKUMA__KUMA__USERNAME
              valueFrom:
                secretKeyRef:
                  key: USERNAME
                  name: autokuma-kuma-credentials
            - name: AUTOKUMA__KUMA__PASSWORD
              valueFrom:
                secretKeyRef:
                  key: PASSWORD
                  name: autokuma-kuma-credentials
          image: ghcr.io/lillecarl/nix-csi/scratch:1.0.1
          name: autokuma
          volumeMounts:
            - mountPath: /nix
              name: nix
              subPath: nix
            - mountPath: /data/monitors
              name: monitors
      volumes:
        - csi:
            driver: nix.csi.store
            volumeAttributes:
              nixExpr: |
                let
                  pkgs = import (builtins.fetchTree {
                    type = "github";
                    owner = "nixos";
                    repo = "nixpkgs";
                    ref = "nixos-unstable";
                  }) {};
                in
                pkgs.autokuma
          name: nix
        - configMap:
            name: autokuma-monitors
          name: monitors
