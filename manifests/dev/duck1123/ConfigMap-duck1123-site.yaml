apiVersion: v1
data:
  auth.js: |
    // NIP-07 login — signing happens entirely inside the visitor's browser
    // extension (e.g. Alby, nos2x); this page never sees a private key.

    export function hasExtension() {
      return typeof window !== "undefined" && !!window.nostr;
    }

    export async function login() {
      if (!hasExtension()) {
        throw new Error("No NIP-07 extension found (try Alby or nos2x)");
      }
      return window.nostr.getPublicKey();
    }

    export async function signEvent(event) {
      if (!hasExtension()) {
        throw new Error("No NIP-07 extension found");
      }
      return window.nostr.signEvent(event);
    }
  comments.js: |
    import { signEvent } from "./auth.js";
    import { publishEvent } from "./nostr.js";

    function formatTime(ts) {
      return new Date(ts * 1000).toLocaleString();
    }

    function renderReply(reply) {
      const el = document.createElement("div");
      el.className = "reply";

      const content = document.createElement("div");
      content.textContent = reply.content;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${reply.pubkey.slice(0, 8)}… · ${formatTime(reply.created_at)}`;

      el.append(content, meta);
      return el;
    }

    export function renderReplies(container, replies) {
      container.innerHTML = "";
      if (!replies.length) return;
      const wrap = document.createElement("div");
      wrap.className = "replies";
      for (const reply of replies) wrap.append(renderReply(reply));
      container.append(wrap);
    }

    export function renderReplyForm({ pool, relays, note, ownerPubkey, myPubkey, onPublished }) {
      const form = document.createElement("form");
      form.className = "reply-form";

      const textarea = document.createElement("textarea");
      textarea.placeholder = "Reply…";
      textarea.required = true;

      const button = document.createElement("button");
      button.type = "submit";
      button.textContent = "Post";

      form.append(textarea, button);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const content = textarea.value.trim();
        if (!content) return;

        button.disabled = true;
        button.textContent = "Posting…";

        try {
          const relay = relays[0] ?? "";
          const unsigned = {
            kind: 1,
            pubkey: myPubkey,
            created_at: Math.floor(Date.now() / 1000),
            tags: [
              ["e", note.id, relay, "reply"],
              ["p", ownerPubkey],
            ],
            content,
          };
          const signed = await signEvent(unsigned);
          await publishEvent(pool, signed, relays);
          textarea.value = "";
          onPublished?.(signed);
        } catch (err) {
          alert(`Failed to post reply: ${err.message ?? err}`);
        } finally {
          button.disabled = false;
          button.textContent = "Post";
        }
      });

      return form;
    }
  config.js: |
    export const CONFIG = {
      pubkey: "47b38f4d3721390d5b6bef78dae3f3e3888ecdbf1844fbb33b88721d366d5c88",
      relays: ["wss://relay.damus.io","wss://nos.lol","wss://relay.nostr.band","wss://relay.primal.net"],
    };
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>duck1123</title>
        <link rel="stylesheet" href="style.css" />
      </head>
      <body>
        <header id="profile">
          <p class="loading">Loading profile…</p>
        </header>

        <div id="auth">
          <button id="login-btn">Login with Nostr extension</button>
          <span id="auth-status"></span>
        </div>

        <main id="notes">
          <p class="loading">Loading notes…</p>
        </main>

        <script type="module" src="main.js"></script>
      </body>
    </html>
  main.js: |
    import { CONFIG } from "./config.js";
    import { createPool, fetchProfile, fetchNotes, fetchReplies } from "./nostr.js";
    import { hasExtension, login } from "./auth.js";
    import { renderReplies, renderReplyForm } from "./comments.js";

    const pool = createPool();
    let myPubkey = null;

    const profileEl = document.getElementById("profile");
    const notesEl = document.getElementById("notes");
    const loginBtn = document.getElementById("login-btn");
    const authStatus = document.getElementById("auth-status");

    function renderProfile(profile) {
      profileEl.innerHTML = "";
      if (!profile) {
        profileEl.innerHTML = '<p class="error">Could not load profile from configured relays.</p>';
        return;
      }

      if (profile.picture) {
        const img = document.createElement("img");
        img.className = "avatar";
        img.src = profile.picture;
        img.alt = profile.name ?? "avatar";
        profileEl.append(img);
      }

      const info = document.createElement("div");

      const h1 = document.createElement("h1");
      h1.textContent = profile.display_name || profile.name || `${CONFIG.pubkey.slice(0, 8)}…`;
      info.append(h1);

      if (profile.about) {
        const about = document.createElement("p");
        about.className = "about";
        about.textContent = profile.about;
        info.append(about);
      }

      if (profile.nip05) {
        const nip05 = document.createElement("p");
        nip05.className = "nip05";
        nip05.textContent = profile.nip05;
        info.append(nip05);
      }

      profileEl.append(info);
    }

    function renderNote(note) {
      const el = document.createElement("article");
      el.className = "note";

      const content = document.createElement("div");
      content.className = "content";
      content.textContent = note.content;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = new Date(note.created_at * 1000).toLocaleString();

      const repliesContainer = document.createElement("div");

      el.append(content, meta, repliesContainer);

      if (myPubkey) {
        const form = renderReplyForm({
          pool,
          relays: CONFIG.relays,
          note,
          ownerPubkey: CONFIG.pubkey,
          myPubkey,
          onPublished: async () => {
            const replies = await fetchReplies(pool, [note.id], CONFIG.relays);
            renderReplies(repliesContainer, replies);
          },
        });
        el.append(form);
      }

      fetchReplies(pool, [note.id], CONFIG.relays).then((replies) => {
        renderReplies(repliesContainer, replies);
      });

      return el;
    }

    async function renderNotes() {
      notesEl.innerHTML = '<p class="loading">Loading notes…</p>';
      const notes = await fetchNotes(pool, CONFIG.pubkey, CONFIG.relays);
      notesEl.innerHTML = "";
      if (!notes.length) {
        notesEl.innerHTML = '<p class="error">No notes found on the configured relays.</p>';
        return;
      }
      for (const note of notes) {
        notesEl.append(renderNote(note));
      }
    }

    function updateAuthUI() {
      if (myPubkey) {
        loginBtn.style.display = "none";
        authStatus.textContent = `Logged in as ${myPubkey.slice(0, 8)}…`;
      } else if (!hasExtension()) {
        loginBtn.disabled = true;
        loginBtn.textContent = "No Nostr extension found";
      } else {
        loginBtn.style.display = "inline-block";
        authStatus.textContent = "";
      }
    }

    loginBtn.addEventListener("click", async () => {
      try {
        myPubkey = await login();
        updateAuthUI();
        await renderNotes();
      } catch (err) {
        alert(err.message ?? String(err));
      }
    });

    updateAuthUI();
    fetchProfile(pool, CONFIG.pubkey, CONFIG.relays).then(renderProfile);
    renderNotes();
  nostr.js: |
    import { SimplePool } from "https://esm.sh/nostr-tools@2.10.4";

    export function createPool() {
      return new SimplePool();
    }

    export async function fetchProfile(pool, pubkey, relays) {
      const events = await pool.querySync(relays, {
        kinds: [0],
        authors: [pubkey],
        limit: 1,
      });
      if (!events.length) return null;
      const latest = events.reduce((a, b) => (b.created_at > a.created_at ? b : a));
      try {
        return JSON.parse(latest.content);
      } catch {
        return null;
      }
    }

    export async function fetchNotes(pool, pubkey, relays, limit = 20) {
      const events = await pool.querySync(relays, {
        kinds: [1],
        authors: [pubkey],
        limit,
      });
      return events.sort((a, b) => b.created_at - a.created_at);
    }

    // Single-level replies only (NIP-10 "reply" marker) — not full threading.
    export async function fetchReplies(pool, noteIds, relays) {
      if (!noteIds.length) return [];
      const events = await pool.querySync(relays, {
        kinds: [1],
        "#e": noteIds,
      });
      return events.sort((a, b) => a.created_at - b.created_at);
    }

    export function publishEvent(pool, event, relays) {
      return Promise.allSettled(pool.publish(relays, event));
    }
  style.css: |
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #666666;
      --border: #e2e2e2;
      --accent: #7c3aed;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #f0f0f0;
        --muted: #9a9a9a;
        --border: #2a2a2a;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 1.5rem;
      max-width: 640px;
      margin-inline: auto;
      background: var(--bg);
      color: var(--fg);
      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
      line-height: 1.5;
    }

    #profile {
      display: flex;
      gap: 1rem;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    #profile img.avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--border);
    }

    #profile h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    #profile p.about {
      margin: 0.25rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #profile p.nip05 {
      margin: 0.15rem 0 0;
      color: var(--accent);
      font-size: 0.8rem;
    }

    #auth {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 0.9rem;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .note {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .note .content {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .note .meta {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }

    .replies {
      margin-top: 0.75rem;
      padding-left: 0.75rem;
      border-left: 2px solid var(--border);
    }

    .reply {
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .reply .meta {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .reply-form {
      margin-top: 0.5rem;
      display: flex;
      gap: 0.5rem;
    }

    .reply-form textarea {
      flex: 1;
      min-height: 2.5rem;
      resize: vertical;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      padding: 0.4rem;
      font-family: inherit;
    }

    .loading,
    .error {
      color: var(--muted);
      font-style: italic;
    }

    .error {
      color: #d33;
    }
kind: ConfigMap
