apiVersion: apps/v1
kind: Deployment
metadata:
  name: duck1123
  namespace: duck1123
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: duck1123
  template:
    metadata:
      labels:
        app.kubernetes.io/name: duck1123
    spec:
      containers:
        - command:
            - python3
            - /scripts/server.py
          env:
            - name: PORT
              value: "8080"
          image: ghcr.io/lillecarl/nix-csi/scratch:1.0.1
          name: duck1123
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - mountPath: /nix
              name: nix
              subPath: nix
            - mountPath: /scripts
              name: scripts
      volumes:
        - csi:
            driver: nix.csi.store
            volumeAttributes:
              nixExpr: |
                let
                  pkgs = import (builtins.fetchTree {
                    type = "github";
                    owner = "nixos";
                    repo = "nixpkgs";
                    ref = "nixos-unstable";
                  }) {};
                  site = (builtins.getFlake "github:duck1123/k3s-fleetops").packages.x86_64-linux.duck1123-site;
                in
                pkgs.symlinkJoin {
                  name = "duck1123-runtime";
                  paths = [
                    pkgs.python3
                    site
                  ];
                }
          name: nix
        - configMap:
            name: duck1123-server
          name: scripts
