apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      containers:
        - args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          command:
            - cloudflared
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  key: tunnelToken
                  name: cloudflared
            - name: SSL_CERT_FILE
              value: /nix/var/result/etc/ssl/certs/ca-bundle.crt
          image: ghcr.io/lillecarl/nix-csi/scratch:1.0.1
          name: cloudflared
          volumeMounts:
            - mountPath: /nix
              name: nix
              subPath: nix
      volumes:
        - csi:
            driver: nix.csi.store
            volumeAttributes:
              nixExpr: |
                let
                  pkgs = import (builtins.fetchTree {
                    type = "github";
                    owner = "nixos";
                    repo = "nixpkgs";
                    ref = "nixos-unstable";
                  }) {};
                in
                pkgs.symlinkJoin {
                  name = "cloudflared-bundle";
                  paths = [
                    pkgs.cloudflared
                    pkgs.cacert
                  ];
                }
          name: nix
