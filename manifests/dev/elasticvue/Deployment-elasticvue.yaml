apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticvue
  namespace: elasticvue
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticvue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticvue
    spec:
      containers:
        - env:
            - name: ELASTICVUE_CLUSTERS
              valueFrom:
                secretKeyRef:
                  key: ELASTICVUE_CLUSTERS
                  name: elasticvue-clusters
          image: cars10/elasticvue:1.15.0
          imagePullPolicy: IfNotPresent
          name: elasticvue
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 32Mi
