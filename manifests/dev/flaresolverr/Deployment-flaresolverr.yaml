apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: flaresolverr
    app.kubernetes.io/name: flaresolverr
    app.kubernetes.io/version: latest
  name: flaresolverr
  namespace: flaresolverr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: flaresolverr
      app.kubernetes.io/name: flaresolverr
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: flaresolverr
        app.kubernetes.io/name: flaresolverr
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: LOG_LEVEL
              value: info
            - name: TZ
              value: Etc/UTC
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8191
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 5
          name: flaresolverr
          ports:
            - containerPort: 8191
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8191
            initialDelaySeconds: 20
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      serviceAccountName: default
