apiVersion: v1
data:
  server.toml: |
    listen = "[::]:8080"
    allowed-hosts = ["attic.home.kronkltd.net"]
    api-endpoint = "https://attic.home.kronkltd.net/"

    [storage]
    type = "s3"
    region = "us-east-1"
    bucket = "attic"
    endpoint = "http://rustfs.rustfs:9000"
kind: ConfigMap
metadata:
  name: attic
  namespace: attic
