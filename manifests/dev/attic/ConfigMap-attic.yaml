apiVersion: v1
data:
  server.toml: |
    listen = "[::]:8080"
    allowed-hosts = ["attic.home.kronkltd.net"]
    api-endpoint = "https://attic.home.kronkltd.net/"

    # url intentionally omitted: falls back to $ATTIC_SERVER_DATABASE_URL.
    # The [database] header must still be present or serde fails with
    # "missing field `database`" instead of applying the per-field default.
    [database]

    [storage]
    type = "s3"
    region = "us-east-1"
    bucket = "attic"
    endpoint = "http://rustfs.rustfs:9000"

    # Upstream defaults from server/src/config-template.toml — these fields
    # have no serde defaults of their own, unlike [database]'s url.
    [chunking]
    nar-size-threshold = 65536
    min-size = 16384
    avg-size = 65536
    max-size = 262144

    [compression]
    type = "zstd"
kind: ConfigMap
metadata:
  name: attic
  namespace: attic
