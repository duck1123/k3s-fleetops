apiVersion: apps/v1
kind: Deployment
metadata:
  name: attic
  namespace: attic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: attic
      app.kubernetes.io/name: attic
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: attic
        app.kubernetes.io/name: attic
    spec:
      containers:
        - command:
            - atticd
            - -f
            - /etc/atticd/server.toml
          env:
            - name: TZ
              value: Etc/UTC
            - name: AWS_REGION
              value: garage
            - name: AWS_DEFAULT_REGION
              value: garage
            - name: ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64
              valueFrom:
                secretKeyRef:
                  key: TOKEN_HS256_SECRET_BASE64
                  name: attic-token-hs256
            - name: ATTIC_SERVER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: attic-database-url
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: AWS_ACCESS_KEY_ID
                  name: attic-s3-credentials
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: AWS_SECRET_ACCESS_KEY
                  name: attic-s3-credentials
            - name: SSL_CERT_FILE
              value: /nix/var/result/etc/ssl/certs/ca-bundle.crt
          image: ghcr.io/lillecarl/nix-csi/scratch:1.0.1
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 120
            periodSeconds: 30
            tcpSocket:
              port: 8080
            timeoutSeconds: 5
          name: attic
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 10
            periodSeconds: 10
            tcpSocket:
              port: 8080
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /nix
              name: nix
              subPath: nix
            - mountPath: /etc/atticd
              name: config
      volumes:
        - csi:
            driver: nix.csi.store
            volumeAttributes:
              nixExpr: |
                (builtins.getFlake "github:duck1123/k3s-fleetops").packages.x86_64-linux.attic-server-bundle
          name: nix
        - configMap:
            name: attic
          name: config
